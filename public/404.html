<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found | Converleon</title>
    <meta name="description" content="The requested Converleon page could not be found." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://www.converleon.com/" />
    <script>
      // GitHub Pages SPA fallback: redirect unknown paths to index with encoded route.
      var segmentCount = 0;
      var locationRef = window.location;

      locationRef.replace(
        locationRef.protocol +
          "//" +
          locationRef.hostname +
          (locationRef.port ? ":" + locationRef.port : "") +
          locationRef.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
          "/?/" +
          locationRef.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (locationRef.search ? "&" + locationRef.search.slice(1).replace(/&/g, "~and~") : "") +
          locationRef.hash
      );
    </script>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This page moved or does not exist. <a href="/">Return to Converleon</a>.</p>
    </main>
  </body>
</html>
